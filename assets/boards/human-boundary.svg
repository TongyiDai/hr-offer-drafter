<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>草稿与发送，是两个人</title><desc>Geometry Board for Offer 起草.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">草稿与发送，是两个人</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">Agent 交付草稿，人承担发送与定薪</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="112" y="200" width="452" height="322" fill="#F5F5F5"/><rect x="704" y="200" width="384" height="322" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/><line x1="640" y1="188" x2="640" y2="540" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7"/><text x="338" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#666666">Agent</text><text x="896" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#666666">招聘负责人 · 合规</text><circle cx="260" cy="350" r="56" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="260" y="345" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">整理</text><text x="260" y="370" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">拟稿</text><line x1="330" y1="350" x2="462" y2="350" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="466" y="314" width="88" height="72" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="510" y="344" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">标记</text><text x="510" y="367" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">待确认</text><line x1="554" y1="350" x2="616" y2="350" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="640" cy="350" r="17" fill="#2F6BFF"/><text x="640" y="416" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="650" fill="#2F6BFF">发送闸门</text><line x1="664" y1="350" x2="756" y2="350" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="870" cy="350" r="72" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="870" cy="350" r="47" fill="none" stroke="#E8E8E8" stroke-width="1"/><text x="870" y="343" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#111111">定薪 · 审批</text><text x="870" y="369" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">确认后发送</text><text x="338" y="488" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">只交付 offer 草稿</text><text x="896" y="488" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">承担发送与定薪责任</text></svg>
