<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>现金归现金，股权归股权</title><desc>Geometry Board for Offer 起草.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">现金归现金，股权归股权</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">薪酬包按口径拆开，不混成一个数字</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="182" y="210" width="236" height="74" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="300" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">基础薪资</text><text x="300" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">周期薪资</text><path d="M 300 288 C 300 330 600 320 600 372" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="482" y="210" width="236" height="74" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="600" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">目标奖金</text><text x="600" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">基础 × 比例，目标值</text><path d="M 600 288 C 600 330 600 320 600 372" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="782" y="210" width="236" height="74" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="900" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">首年签字费</text><text x="900" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">仅计入首年</text><path d="M 900 288 C 900 330 600 320 600 372" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="600" cy="420" r="60" fill="#2F6BFF"/><text x="600" y="414" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" fill="#FFFFFF">现金</text><text x="600" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" fill="#FFFFFF">首年总包</text><rect x="900" y="392" width="236" height="96" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5"/><text x="1018" y="424" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">股权</text><text x="1018" y="448" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">按行权安排单列</text><text x="1018" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#2F6BFF">不折成现金</text><line x1="720" y1="458" x2="890" y2="458" stroke="#B8B8B8" stroke-width="1.2" stroke-dasharray="5 7"/><text x="805" y="448" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">分开</text><text x="600" y="560" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" fill="#111111">现金按口径相加，股权单列——不把两类混成一个数字</text></svg>
