<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>发送前，先过闸门</title><desc>Geometry Board for Offer 起草.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">发送前，先过闸门</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">带宽、审批、合规只标状态，人做决定</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><circle cx="196" cy="360" r="56" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="196" y="355" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">Offer</text><text x="196" y="379" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">草稿</text><rect x="374" y="322" width="192" height="76" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="470" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#111111">带宽核对</text><text x="470" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">区间内 / 带宽外</text><line x1="252" y1="360" x2="370" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="604" y="322" width="192" height="76" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="700" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#111111">编制 · 薪酬审批</text><text x="700" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">approved / pending</text><line x1="566" y1="360" x2="600" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="834" y="322" width="192" height="76" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="930" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" fill="#111111">合规复核</text><text x="930" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">条款 / 措辞</text><line x1="796" y1="360" x2="830" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1026" y1="360" x2="1058" y2="360" stroke="#B8B8B8" stroke-width="1.5" stroke-dasharray="5 7" marker-end="url(#arrow)"/><rect x="1058" y="326" width="84" height="68" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/><text x="1100" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="650" fill="#2F6BFF">人确认</text><text x="1100" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">后发送</text><text x="600" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">每一道闸门只标状态，不替人做“能不能发”的决定</text><text x="470" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#2F6BFF">↑ 带宽外→需额外审批</text><text x="700" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#2F6BFF">↑ 非 approved→待确认</text></svg>
