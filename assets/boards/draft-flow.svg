<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<title>从要素到草稿，只到草稿为止</title><desc>Geometry Board for Offer 起草.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z" fill="#111111"/></marker></defs>
<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">从要素到草稿，只到草稿为止</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">Agent 拟稿，发送与定薪留给人</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><rect x="86" y="320" width="208" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.3"/><text x="190" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">脱敏要素</text><text x="190" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">岗位·职级·薪酬组成</text><rect x="346" y="320" width="208" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.3"/><text x="450" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">校验</text><text x="450" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">脱敏 · 口径 · 带宽</text><line x1="294" y1="362" x2="342" y2="362" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="606" y="320" width="208" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.3"/><text x="710" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#111111">草稿</text><text x="710" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">薪酬包 · Letter · 提示</text><line x1="554" y1="362" x2="602" y2="362" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="866" y="320" width="208" height="84" fill="#F5F5F5" stroke="#2F6BFF" stroke-width="1.5"/><text x="970" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" fill="#2F6BFF">人工复核</text><text x="970" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">定薪 · 审批 · 发送</text><line x1="814" y1="362" x2="862" y2="362" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="710" y1="300" x2="710" y2="260" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7"/><text x="710" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="600" fill="#2F6BFF">只到草稿为止</text><text x="600" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">Agent 把要素做成可复核草稿，发送与定薪留给人</text></svg>
